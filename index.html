<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubTracker Pro | متابع الاشتراكات والخدمات</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="p-6 md:p-12 min-h-screen">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- الهيدر -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-3xl font-bold text-indigo-400">SubTracker Pro ⚡</h1>
        <p class="text-slate-400 text-sm mt-1">إدارة واحتساب اشتراكاتك وخوادمك في مكان واحد</p>
      </div>
      <span class="bg-indigo-500/10 text-indigo-400 text-xs px-3 py-1.5 rounded-full border border-indigo-500/20 font-semibold">Self-Hosted Version</span>
    </div>

    <!-- كروت الإحصائيات -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">المصاريف الشهريّة</p>
        <h3 id="monthlyTotal" class="text-3xl font-bold text-emerald-400 mt-2">$0.00</h3>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">المصاريف السنويّة (المقدرة)</p>
        <h3 id="yearlyTotal" class="text-3xl font-bold text-blue-400 mt-2">$0.00</h3>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/50 p-5 rounded-2xl">
        <p class="text-slate-400 text-sm">إجمالي الاشتراكات</p>
        <h3 id="subCount" class="text-3xl font-bold text-indigo-400 mt-2">0</h3>
      </div>
    </div>

    <!-- فورم الإضافة + الجدول -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- نموذج إضافة اشتراك -->
      <div class="bg-slate-800/40 border border-slate-700/50 p-6 rounded-2xl h-fit space-y-4">
        <h2 class="text-xl font-bold text-slate-200">إضافة اشتراك جديد</h2>
        <form id="addForm" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">اسم الخدمة / السيرفر</label>
            <input type="text" id="name" required placeholder="مثلاً: Vercel, Netflix, Hostinger" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">السعر ($)</label>
            <input type="number" step="0.01" id="price" required placeholder="12.99" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">دورة الدفع</label>
            <select id="billing_cycle" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
              <option value="monthly">شهري</option>
              <option value="yearly">سنوي</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">تاريخ التجديد القادم</label>
            <input type="date" id="next_payment_date" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-300">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">القسم</label>
            <input type="text" id="category" placeholder="Servers, Entertainment, SaaS" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition duration-200 text-sm shadow-lg shadow-indigo-600/20">حفظ الاشتراك</button>
        </form>
      </div>

      <!-- قائمة الاشتراكات -->
      <div class="lg:col-span-2 bg-slate-800/40 border border-slate-700/50 p-6 rounded-2xl">
        <h2 class="text-xl font-bold text-slate-200 mb-4">الاشتراكات الحالية</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-right text-sm text-slate-300">
            <thead class="bg-slate-900/60 text-slate-400 text-xs border-b border-slate-700">
              <tr>
                <th class="p-3 rounded-r-lg">الخدمة</th>
                <th class="p-3">السعر</th>
                <th class="p-3">التكرار</th>
                <th class="p-3">التجديد القادم</th>
                <th class="p-3 rounded-l-lg">حذف</th>
              </tr>
            </thead>
            <tbody id="subTableBody" class="divide-y divide-slate-800">
              <!-- سيتم ملء الجدول بالبيانات -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    async function loadSubscriptions() {
      const res = await fetch('/api/subscriptions');
      const data = await res.json();

      document.getElementById('monthlyTotal').innerText = `$${data.stats.monthlyTotal}`;
      document.getElementById('yearlyTotal').innerText = `$${data.stats.yearlyTotal}`;
      document.getElementById('subCount').innerText = data.stats.count;

      const tbody = document.getElementById('subTableBody');
      tbody.innerHTML = '';

      if (data.subscriptions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-slate-500">لا توجد اشتراكات مضافة بعد.</td></tr>`;
        return;
      }

      data.subscriptions.forEach(sub => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/50 transition">
            <td class="p-3 font-semibold text-white">
              ${sub.name}
              <span class="block text-[10px] text-indigo-400 font-normal">${sub.category}</span>
            </td>
            <td class="p-3 font-bold text-emerald-400">$${sub.price}</td>
            <td class="p-3"><span class="bg-slate-800 text-xs px-2 py-0.5 rounded border border-slate-700">${sub.billing_cycle === 'monthly' ? 'شهري' : 'سنوي'}</span></td>
            <td class="p-3 text-slate-400">${sub.next_payment_date}</td>
            <td class="p-3">
              <button onclick="deleteSub(${sub.id})" class="text-red-400 hover:text-red-300 hover:bg-red-500/10 p-1.5 rounded-lg transition">🗑️</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        price: parseFloat(document.getElementById('price').value),
        billing_cycle: document.getElementById('billing_cycle').value,
        next_payment_date: document.getElementById('next_payment_date').value,
        category: document.getElementById('category').value
      };

      await fetch('/api/subscriptions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('addForm').reset();
      loadSubscriptions();
    });

    async function deleteSub(id) {
      if (confirm('هل أنت تأكد من حذف هذا الاشتراك؟')) {
        await fetch(`/api/subscriptions/${id}`, { method: 'DELETE' });
        loadSubscriptions();
      }
    }

    loadSubscriptions();
  </script>
</body>
</html>
